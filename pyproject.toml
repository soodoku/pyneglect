[project]
name = "pyneglect"
version = "0.1.0"
description = "Monthly discovery of popular Python projects with open issues"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "jinja2>=3.1", "tenacity>=9"]
keywords = ["pypi", "open-source", "github", "discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/soodoku/pyneglect"
Issues = "https://github.com/soodoku/pyneglect/issues"
Report = "https://gsood.com/pyneglect/"

[project.scripts]
pyneglect = "pyneglect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "playwright>=1.50"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
