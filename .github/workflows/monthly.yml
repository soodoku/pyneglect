name: Monthly report
on:
  schedule:
    - cron: '17 8 5 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monthly-report
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest
      - id: edition
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/pyneglect
          key: monthly-v1-${{ steps.edition.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monthly-v1-${{ steps.edition.outputs.month }}-
      - name: Collect and render
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run pyneglect run
      - name: Save working checkpoint
        if: always() && steps.edition.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/pyneglect
          key: monthly-v1-${{ steps.edition.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save complete edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'Save monthly discovery snapshot'
            git push
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
