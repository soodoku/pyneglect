name: Checks
on:
  push:
    paths-ignore: ['snapshots/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Check rendered report in Chromium
        if: hashFiles('snapshots/*.json') != ''
        run: |
          uv run pyneglect render
          uv run playwright install --with-deps chromium
          uv run python tests/browser_check.py site
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
